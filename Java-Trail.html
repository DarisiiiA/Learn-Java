ite;overflow:hidden}.module.selected{border-color:#9eaf7c}.module-head{display:flex;align-items:center;gap:14px;padding:19px;width:100%;border:0;background:transparent;text-align:left;color:inherit}.number{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#f2f3ed;color:#7c8474;font:700 13px Manrope}.selected .number{background:#ebf0d9;color:#61733e}.module-title{font-weight:700;font-size:13px;flex:1}.module-title small{font-weight:400;display:block;font-size:10px;color:#8d9387;margin-top:6px}.pill{font-size:9px;border-radius:20px;background:#f0f4e4;color:#7b8c52;padding:5px 9px;white-space:nowrap}.chevron{color:#9aa08f}.lesson-list{padding:0 19px 12px 70px}.lesson-row{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid #f0f1ea;background:transparent;padding:13px 0;font-size:11px;color:#69735f;text-align:left}.lesson-row:hover{color:#244c31}.lesson-row span:last-child{font-size:10px;color:#9b9f93}.tip-card{border:1px solid #e4e8d7;border-radius:12px;padding:22px;background:#f0f3e5}.tip-icon{font-size:23px;color:#8b9c53}.tip-card h3{font:700 14px Manrope;margin:15px 0 10px}.tip-card p{font-size:11px;line-height:1.9;color:#7e856f}.tip-card code{display:block;margin:16px 0;padding:15px 11px;background:#e5ead7;border-radius:6px;font-size:10px;line-height:1.8;color:#526142}.tip-card .note{border-top:1px solid #dce2ce;padding-top:15px;font-size:10px}.quote{padding:24px 12px;color:#939986;font-size:11px;line-height:1.9}.quote span{display:block;color:#b0b4a7;font-size:10px;margin-top:8px}footer{border-top:1px solid var(--line);margin-top:42px;padding:24px 0;display:flex;justify-content:space-between;font-size:10px;color:#a0a595}.back{background:none;border:0;padding:0;color:#718361;margin-bottom:20px}.lesson-body{max-width:820px;margin:36px auto}.lesson-body h1{font-size:29px}.reading{font-size:15px;line-height:1.9;color:#596651}.reading code{background:#e9eedf;padding:2px 5px;border-radius:4px}pre{background:#1d342c;color:#e3ebd5;padding:24px;border-radius:12px;line-height:1.8;overflow:auto;font-size:13px}.exercise{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;margin-top:25px}.exercise h3{margin-top:0;font:700 18px Manrope}.option{display:block;width:100%;text-align:left;background:#fafbf7;border:1px solid var(--line);border-radius:7px;padding:13px 15px;margin:9px 0}.option:hover{border-color:#8fA66a}.option.chosen{border-color:var(--green);background:#eaf0dc}.feedback{line-height:1.7;margin-top:16px;color:#547044}.feedback.error{color:#a4503d}textarea{width:100%;min-height:115px;border:1px solid #d7dfca;border-radius:7px;padding:16px;background:#fafbf7;color:#25422f;font:14px/1.8 monospace}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.card h3{font:700 17px Manrope}.card p{color:#7e8675;line-height:1.8}.card ul{padding-left:20px;line-height:2;color:#718064}.secondary{border:1px solid #cfd8bf;background:white;border-radius:7px;padding:10px 15px;color:var(--green)}#toast{position:fixed;bottom:25px;right:25px;background:var(--green);color:white;border-radius:9px;padding:15px 22px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.visible{opacity:1}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #acbf68;outline-offset:3px}@media(min-width:1400px){main{padding:0 65px}.hero{min-height:240px}}@media(max-width:1100px){aside{width:210px;padding:30px 17px}main{margin-left:210px;padding:0 28px}.path-layout{grid-template-columns:1fr 220px}.hero{grid-template-columns:1fr 180px}}@media(max-width:800px){aside{position:static;width:auto;padding:18px 20px;border-bottom:1px solid var(--line)}.brand{font-size:22px}.workspace-label,.sidebar-bottom{display:none}nav{display:flex;margin-top:15px;gap:5px}.nav{font-size:11px;padding:10px;gap:6px;width:auto;margin:0}main{margin:0;padding:0 20px}header{height:60px}.save-status{display:none}.intro{margin-top:28px}.intro h1{font-size:28px}.date-badge{display:none}.hero{grid-template-columns:1fr 100px;padding:25px;min-height:220px}.hero-art .orbit{width:130px;height:130px}.hero-art .two{width:100px;height:100px}.code-tile{width:85px;height:85px;font-size:32px}.spark{display:none}.hero h2{font-size:23px}.path-layout{grid-template-columns:1fr}.path-side{display:none}.stats{gap:9px}.stat{padding:13px 9px;gap:8px}.stat-icon{width:29px;height:29px;font-size:15px}.stat strong{font-size:17px}.stat small{font-size:9px}.cards{grid-template-columns:1fr}footer span{display:none}.pill{font-size:8px}.lesson-list{padding-left:25px}.hero p{max-width:260px}}
.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-width:0}.card pre{max-width:100%}.breadcrumb{min-width:0}@media(max-width:800px){.cards{grid-template-columns:minmax(0,1fr)}}</style></head>
<body><aside><a class="brand" href="#"><span class="brand-icon">♨</span> java trail<span class="brand-dot">.</span></a><div class="workspace-label">YOUR LEARNING SPACE</div><nav><button class="nav active" data-view="learn">▦ <span>Learning path</span></button><button class="nav" data-view="reference">⌘ <span>Field notes</span></button><button class="nav" data-view="projects">◇ <span>Practice projects</span></button></nav><div class="sidebar-bottom"><div class="little-plant">✳</div><h3>A little every day.</h3><p>Big things start with small,<br>consistent steps.</p><div class="level">🌱 &nbsp; Java explorer</div></div></aside><main><header><div class="breadcrumb">Your workspace <span>/</span> <b id="crumb">Learning path</b></div><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">☾ Dark mode</button><span class="save-status">● &nbsp; Progress saved on this device</span></header><div id="content"></div><footer>Made for curious minds. <span>One concept. One small win. One step forward.</span></footer></main><div id="toast" role="status"></div><script>const modules = [
 {title:'Meet Java',desc:'Your first steps into a new language',lessons:[
 ['Hello, world!','5 min','Java programs are organized into classes. The <code>main</code> method is the entry point where execution begins. <code>System.out.println</code> prints a line of text. Statements end with a semicolon.','public class Hello {\n    public static void main(String[] args) {\n        System.out.println("Hello, world!");\n    }\n}','What does this program print?',['Hello, world!','Hello','Nothing'],0,'println prints exactly the text inside the quotation marks, followed by a new line.'],
 ['Anatomy of a program','6 min','Curly braces group code into blocks. Java is case-sensitive: <code>Main</code> and <code>main</code> are different names. A public class named <code>Hello</code> belongs in a file named <code>Hello.java</code>.','public class Hello {\n    public static void main(String[] args) {\n        // This is a comment. Java ignores it.\n        System.out.println("Keep going!");\n    }\n}','Which filename matches public class Garden?',['garden.java','Garden.java','Garden.js'],1,'A public top-level class uses the same case-sensitive name as its .java file.'],
 ['Your first line of Java','5 min','Let’s write a statement. Text goes inside double quotation marks. A method call needs parentheses, and the statement needs a semicolon.','System.out.println("I can learn Java!");','Write a statement that prints Hello, Java!',null,'System.out.println("Hello, Java!");','Use System.out.println, put Hello, Java! in double quotes, and end with a semicolon.']
 ]},
 {title:'Variables & types',desc:'Give your ideas a place to live',lessons:[
 ['Storing a value','7 min','A variable is a named place to store a value. Declare its type, choose a name, and assign a value with <code>=</code>. Use <code>int</code> for whole numbers, <code>double</code> for decimal numbers, <code>boolean</code> for true or false, and <code>String</code> for text.','int age = 21;\ndouble price = 4.50;\nboolean learning = true;\nString name = "Alex";\nSystem.out.println(name);','Which declaration stores a whole number correctly?',['int score = 10;','int score = "10";','boolean score = 10;'],0,'10 is an integer literal. Quoted "10" is a String, and boolean accepts true or false.'],
 ['Strings & joining text','6 min','Use <code>+</code> to join text. When one side is a String, Java combines the values as text. Use parentheses to calculate a numeric expression before joining it.','String name = "Sam";\nSystem.out.println("Hi, " + name);\nSystem.out.println("Total: " + (2 + 3));','What does "Java" + " trail" produce?',['Java trail','Javatrail','An error'],0,'The space at the beginning of " trail" is part of the String.'],
 ['Numbers & operators','7 min','Java supports <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>, and <code>%</code>. Division between two integers drops the fractional part. The remainder operator <code>%</code> gives what is left after division.','System.out.println(7 / 2); // 3\nSystem.out.println(7.0 / 2); // 3.5\nSystem.out.println(7 % 2); // 1','What is the value of 10 % 3?',['3','1','0'],1,'3 fits into 10 three times, leaving a remainder of 1.']
 ]},
 {title:'Decisions & loops',desc:'Make your code think and repeat',lessons:[
 ['Choosing with if','8 min','An <code>if</code> statement runs a block when its condition is true. <code>else</code> handles the alternative. Use <code>==</code> to compare primitive values and <code>=</code> to assign. Use <code>.equals()</code> to compare String contents.','int temperature = 25;\nif (temperature > 20) {\n    System.out.println("Warm");\n} else {\n    System.out.println("Cool");\n}','Which expression compares String contents?',['name = "Sam"','name.equals("Sam")','name == "Sam"'],1,'equals checks String contents. == compares object references and is not reliable for comparing text.'],
 ['Repeating with for','8 min','A <code>for</code> loop has an initialization, a condition, and an update. The condition is checked before each repetition. <code>i++</code> increases i by one.','for (int i = 0; i < 3; i++) {\n    System.out.println(i);\n}','How many times does this loop run?',['2','3','4'],1,'It runs for i = 0, 1, and 2. At 3, the condition i < 3 becomes false.'],
 ['While & stopping','7 min','A <code>while</code> loop repeats while a condition is true. Make sure something can change the condition, or the loop might never finish. <code>break</code> exits a loop immediately.','int count = 3;\nwhile (count > 0) {\n    System.out.println(count);\n    count--;\n}','What happens if count-- is removed?',['It stops after 3 runs','It never enters the loop','It keeps printing 3'],2,'count stays 3, so count > 0 remains true. This creates an infinite loop.']
 ]},
 {title:'Methods & collections',desc:'Organize your code, work with more',lessons:[
 ['Reusable methods','9 min','A method packages a task under a name. Parameters supply inputs; <code>return</code> supplies a result. A <code>void</code> method returns no value. A static method belongs to the class and can be called directly from static main.','static int square(int n) {\n    return n * n;\n}\n// Inside main:\nSystem.out.println(square(4));','What does square(4) return?',['8','16','4'],1,'The method multiplies its argument by itself: 4 × 4 = 16.'],
 ['Arrays','8 min','An array stores a fixed number of elements of one type. Indices start at zero. <code>length</code> tells you the number of elements. The last valid index is length minus one.','String[] colors = {"green", "blue", "gold"};\nSystem.out.println(colors[0]);\nSystem.out.println(colors.length);','Which expression accesses "blue"?',['colors[0]','colors[1]','colors[2]'],1,'Index 0 contains green; index 1 contains blue.'],
 ['Growing with ArrayList','9 min','An <code>ArrayList</code> can grow as you add items. Import it from <code>java.util</code>. Generic types such as <code>String</code> specify what it stores. Use <code>Integer</code>, rather than int, for a list of integers.','import java.util.ArrayList;\n// Inside main:\nArrayList<String> tasks = new ArrayList<>();\ntasks.add("Learn Java");\nSystem.out.println(tasks.get(0));\nSystem.out.println(tasks.size());','Which method adds an item?',['tasks.add("Practice")','tasks.put("Practice")','tasks.append("Practice")'],0,'ArrayList uses add for insertion, get for retrieval, and size for the number of items.']
 ]},
 {title:'Objects & classes',desc:'Bring everything together',lessons:[
 ['Your first object','10 min','A class describes a kind of thing. An object is an instance of that class. Fields store its state, methods describe behavior, and a constructor initializes new instances.','class Plant {\n    String name;\n    Plant(String name) {\n        this.name = name;\n    }\n    void grow() {\n        System.out.println(name + " is growing");\n    }\n}\n// Inside main:\nPlant fern = new Plant("Fern");\nfern.grow();','What does new Plant("Fern") do?',['Renames the Plant class','Creates a Plant object','Imports a library'],1,'new calls the constructor to create and initialize an object.'],
 ['Encapsulation','9 min','Keep fields <code>private</code> and expose intentional operations through methods. This lets a class protect its rules. For example, a bank account can reject negative deposits instead of letting callers change its balance directly.','class Account {\n    private int balance = 0;\n    public void deposit(int amount) {\n        if (amount > 0) balance += amount;\n    }\n    public int getBalance() {\n        return balance;\n    }\n}','Why make balance private?',['To prevent all changes','To control access through methods','To make it a constant'],1,'Private access restricts direct access from other classes. Methods can validate changes.'],
 ['Handling exceptions','10 min','Exceptions signal that something went wrong. A <code>try</code> block contains a risky operation; a matching <code>catch</code> handles a failure. Catch specific exceptions so you know what went wrong.','try {\n    int number = Integer.parseInt("hello");\n    System.out.println(number);\n} catch (NumberFormatException e) {\n    System.out.println("Please enter a number");\n}','What will this code print?',['hello','0','Please enter a number'],2,'hello cannot be parsed as an integer, so NumberFormatException is caught.']
 ]}
];
let completed=new Set();try{const saved=JSON.parse(localStorage.getItem('java-trail-progress')||'[]');if(Array.isArray(saved)) completed=new Set(saved.filter(x=>typeof x==='string'&&/^\d-\d$/.test(x)));}catch{}let openModule=0;let currentView='learn';const content=document.querySelector('#content');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('java-trail-progress',JSON.stringify([...completed]));}catch{document.querySelector('.save-status').textContent='Progress available for this session only';}}
function nextLesson(){for(let m=0;m<modules.length;m++)for(let l=0;l<modules[m].lessons.length;l++)if(!completed.has(`${m}-${l}`))return[m,l];return null;}
function intro(label,title,subtitle){return `<div class="intro"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p class="sub">${subtitle}</p></div><div class="date-badge">✧ &nbsp; A good day to learn something</div></div>`;}
function setNav(view){currentView=view;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));document.querySelector('#crumb').textContent={learn:'Learning path',reference:'Field notes',projects:'Practice projects'}[view];}
function renderPath(){setNav('learn');const next=nextLesson();const total=modules.reduce((n,m)=>n+m.lessons.length,0);content.innerHTML=intro('Small steps. Real progress.','Your Java journey starts here.','Build a strong foundation, one little lesson at a time.')+`<section class="hero"><div><div class="eyebrow">${completed.size?'KEEP YOUR MOMENTUM':'LET’S START WITH THE BASICS'}</div><h2>${next?modules[next[0]].lessons[next[1]][0]:'Look how far you’ve come.'}</h2><p>${next?'A little theory, a little practice, and a new skill to call your own. Your next small win is waiting.':'You’ve finished every lesson. Put your knowledge into practice with a project.'}</p><button class="primary" id="continue">${next?(completed.size?'Continue learning':'Start learning'):'Explore projects'} <span>↗</span></button></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="code-tile">{ }</div><span class="spark">✳</span></div></section><section class="stats"><div class="stat"><div class="stat-icon">✓</div><div><strong>${completed.size}<span style="font-size:12px;color:#a6ad9b;font-weight:400"> / ${total}</span></strong><small>Lessons completed</small></div></div><div class="stat"><div class="stat-icon">◷</div><div><strong>${completed.size*25}</strong><small>Experience points</small></div></div><div class="stat"><div class="stat-icon">↗</div><div><strong>${Math.round(completed.size/total*100)}%</strong><small>Path progress</small></div></div></section><div class="section-title"><h2>Your learning path</h2><span>5 chapters · At your own pace</span></div><div class="path-layout"><section class="modules">${modules.map((m,i)=>{const done=m.lessons.filter((_,l)=>completed.has(`${i}-${l}`)).length;return `<article class="module ${openModule===i?'selected':''}"><button class="module-head" data-module="${i}" aria-expanded="${openModule===i}"><span class="number">${done===m.lessons.length?'✓':String(i+1).padStart(2,'0')}</span><span class="module-title">${m.title}<small>${m.desc}</small></span><span class="pill">${done?`${done}/${m.lessons.length} complete`:`${m.lessons.length} lessons`}</span><span class="chevron">${openModule===i?'⌃':'⌄'}</span></button>${openModule===i?`<div class="lesson-list">${m.lessons.map((l,j)=>`<button class="lesson-row" data-lesson="${i}-${j}"><span>${completed.has(`${i}-${j}`)?'✓':'○'} &nbsp; ${l[0]}</span><span>${l[1]} &nbsp; →</span></button>`).join('')}</div>`:''}</article>`;}).join('')}</section><aside-content class="path-side"><div class="tip-card"><div class="tip-icon">☼</div><h3>A little Java wisdom</h3><p>You don’t have to memorize everything. Understanding the “why” is what makes it stick.</p><code>// progress, not perfection<br>practiceEveryDay();</code><p class="note">Try changing one thing in each example. Predict what happens, then find out.</p></div><div class="quote">“The expert in anything was once a beginner.”<span>Your reminder to keep going.</span></div></aside-content></div>`;document.querySelector('#continue').onclick=()=>next?renderLesson(...next):renderProjects();document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{openModule=openModule===+b.dataset.module?-1:+b.dataset.module;renderPath();});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>renderLesson(...b.dataset.lesson.split('-').map(Number)));}
function renderLesson(m,l){setNav('learn');const lesson=modules[m].lessons[l];let choice=null;content.innerHTML=`<article class="lesson-body"><button class="back" id="back">← Back to your path</button><div class="eyebrow">CHAPTER ${m+1} · ${modules[m].title} · ${lesson[1]}</div><h1>${lesson[0]}</h1><p class="reading">${lesson[2]}</p><pre><code>${esc(lesson[3])}</code></pre><section class="exercise"><div class="eyebrow">YOUR TURN</div><h3>${lesson[4]}</h3>${lesson[5]?lesson[5].map((a,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}. &nbsp; ${esc(a)}</button>`).join(''):`<label for="answer">Java statement</label><textarea id="answer" spellcheck="false" placeholder='System.out.println("...");'></textarea><p style="font-size:11px;color:#88917e">Statement practice checks this one line’s syntax. It does not execute Java code.</p>`}<button class="primary" id="check">Check answer <span>→</span></button><div id="feedback" class="feedback" role="status"></div><button class="secondary" id="next" hidden style="margin-top:15px">Next lesson →</button></section></article>`;window.scrollTo(0,0);document.querySelector('#back').onclick=()=>{openModule=m;renderPath();};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('chosen',x===b));});document.querySelector('#check').onclick=()=>{const feedback=document.querySelector('#feedback');if(lesson[5]&&choice===null){feedback.className='feedback error';feedback.textContent='Choose an answer first.';return;}const correct=lesson[5]?choice===lesson[6]:/^\s*System\s*\.\s*out\s*\.\s*println\s*\(\s*"Hello, Java!"\s*\)\s*;\s*$/.test(document.querySelector('#answer').value);feedback.className='feedback'+(correct?'':' error');feedback.textContent=(correct?'✓ You’ve got it! ':'Try again. ')+lesson[7];if(correct){completed.add(`${m}-${l}`);save();document.querySelector('#next').hidden=false;document.querySelector('#next').onclick=()=>{if(l+1<modules[m].lessons.length)renderLesson(m,l+1);else if(m+1<modules.length)renderLesson(m+1,0);else renderProjects();};}};}
function renderReference(){setNav('reference');content.innerHTML=intro('A handy companion','Your Java field notes.','The essentials, always within reach.')+`<label for="search" class="eyebrow">FIND A CONCEPT</label><input id="search" type="search" placeholder="Search variables, loops, arrays…" style="display:block;width:100%;padding:15px;border:1px solid #dce2d1;border-radius:8px;margin:12px 0 25px"><div id="notes" class="cards"></div>`;const notes=document.querySelector('#notes');function draw(q=''){const matches=modules.flatMap(m=>m.lessons).filter(l=>(l[0]+' '+l[2]).toLowerCase().includes(q.toLowerCase()));notes.innerHTML=matches.length?matches.map(l=>`<article class="card"><h3>${l[0]}</h3><p>${l[2]}</p><pre><code>${esc(l[3])}</code></pre></article>`).join(''):'<p>No matching notes. Try “String” or “loop”.</p>';}document.querySelector('#search').oninput=e=>draw(e.target.value);draw();}
const projects=[['01','Personal introduction','Variables & strings','Create a program that introduces you.',['Store your name, age, and favorite hobby in variables.','Print a greeting using String concatenation.','Calculate and print your age next year.'],'Try: int age = 20;\nThen combine a String with (age + 1).'],['02','Number explorer','Decisions & loops','Discover patterns in the numbers around you.',['Loop through the numbers 1 to 20.','Use % to label each number odd or even.','Add all the even numbers and print the total.'],'Use i % 2 == 0 to detect even numbers.\nThe even-number total from 1 to 20 is 110.'],['03','Tiny task list','Methods & collections','Turn a handful of tasks into an organized list.',['Store three tasks in an ArrayList<String>.','Print each task with its number.','Remove one task, then print the remaining count.'],'Import java.util.ArrayList; use add(), get(), remove(), and size().'],['04','Plant collection','Objects & classes','Grow a small garden of your own objects.',['Create a Plant class with name and height fields.','Add a constructor and a grow() method.','Create two plants and grow them by different amounts.'],'Use private fields and public methods.\nLet grow(int amount) reject negative amounts.']];
function renderProjects(){setNav('projects');content.innerHTML=intro('Make it your own','Small projects. Big confidence.','Take what you’ve learned and turn it into something real.')+`<p class="sub" style="margin-bottom:24px">Build these locally with your JDK. Save a public class as ClassName.java, then use <code>javac ClassName.java</code> and <code>java ClassName</code>.</p><div class="cards">${projects.map((p,i)=>`<article class="card"><div class="eyebrow">PROJECT ${p[0]} · ${p[2]}</div><h3>${p[1]}</h3><p>${p[3]}</p><ul>${p[4].map(s=>`<li>${s}</li>`).join('')}</ul><button class="secondary" data-hint="${i}" aria-expanded="false">Show a hint ↗</button><pre id="hint-${i}" hidden>${esc(p[5])}</pre></article>`).join('')}</div>`;document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{const hint=document.querySelector(`#hint-${b.dataset.hint}`);hint.hidden=!hint.hidden;b.textContent=hint.hidden?'Show a hint ↗':'Hide hint';b.setAttribute('aria-expanded',String(!hint.hidden));});}
const themeToggle=document.querySelector('#theme-toggle');
let darkMode=false;
try { const saved=localStorage.getItem('java-trail-theme'); darkMode=saved==='dark'||(!saved&&typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: dark)').matches); } catch {}
function applyTheme(){
  document.documentElement.dataset.theme=darkMode?'dark':'light';
  themeToggle.textContent=darkMode?'☀ Light mode':'☾ Dark mode';
  themeToggle.setAttribute('aria-label',darkMode?'Switch to light mode':'Switch to dark mode');
  themeToggle.setAttribute('aria-pressed',String(darkMode));
}
applyTheme();
themeToggle.onclick=()=>{darkMode=!darkMode;applyTheme();try{localStorage.setItem('java-trail-theme',darkMode?'dark':'light');}catch{}};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{({learn:renderPath,reference:renderReference,projects:renderProjects}[b.dataset.view])();window.scrollTo(0,0);});document.querySelector('.brand').onclick=e=>{e.preventDefault();renderPath();};renderPath();
</script></body></html>
